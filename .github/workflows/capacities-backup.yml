name: Capacities → Google Doc backup

on:
  schedule:
    - cron: "17 * * * *"  # hourly
  workflow_dispatch:
    inputs:
      include_existing:
        description: "First run only: back up all existing notes instead of recording a baseline"
        type: boolean
        default: false

permissions:
  contents: write  # commit the state file back

concurrency:
  group: capacities-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Append new notes to Google Doc
        env:
          CAPACITIES_API_TOKEN: ${{ secrets.CAPACITIES_API_TOKEN }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CAPACITIES_STRUCTURE_IDS: ${{ vars.CAPACITIES_STRUCTURE_IDS }}
        run: |
          python capacities_backup.py ${{ inputs.include_existing && '--include-existing' || '' }}

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Update Capacities backup state"
          git push
