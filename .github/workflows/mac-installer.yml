name: Build Mac installer

# Builds MD-Notes-<version>-mac.dmg (universal: Apple Silicon + Intel).
# - Run it by hand from the Actions tab, or on pull requests that touch the app:
#   the .dmg is attached to the run as an artifact.
# - Push a tag like v0.1.0 to also publish a GitHub Release with the .dmg.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - build/**
      - electron/**
      - shared/**
      - src/**
      - index.html
      - vite.config.ts
      - .github/workflows/mac-installer.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build the app and .dmg
        run: npm run dist
        env:
          # No Apple Developer certificate: the app is ad-hoc signed.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify the app bundle and signature
        run: |
          APP="release/mac-universal/MD Notes.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature=adhoc|Identifier'
          lipo -archs "$APP/Contents/MacOS/MD Notes"
          ls -lh release/*.dmg

      - name: Smoke test (launch the packaged app)
        timeout-minutes: 3
        run: |
          OUT=$(MDNOTES_SMOKE_TEST=1 "release/mac-universal/MD Notes.app/Contents/MacOS/MD Notes" 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q SMOKE_OK

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MD-Notes-mac-installer
          path: release/*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg \
            --title "MD Notes $GITHUB_REF_NAME" \
            --notes "Download the .dmg below. See [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/INSTALL.md) for install steps." \
            --verify-tag
